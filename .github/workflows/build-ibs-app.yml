name: Build IBS Assistant APK

on:
  push:
    paths:
      - "android_app/**"
      - ".github/workflows/build-ibs-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/IBS-Assistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IBS-Assistant-apk
          path: android_app/out/IBS-Assistant.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ibs-app-build-${{ github.run_number }}
          name: IBS Assistant app build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Built from ${{ github.sha }}. Install **IBS-Assistant.apk** on your Android phone.
          files: android_app/out/IBS-Assistant.apk
