name: Build YTDownload APK

on:
  push:
    paths:
      - "ytdownload/**"
      - ".github/workflows/build-ytdownload.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ytdownload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$f" "out/YTDownload-${abi}.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: YTDownload-apks
          path: ytdownload/out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ytdownload-build-${{ github.run_number }}
          name: YTDownload build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Built from ${{ github.sha }}.
            Most phones: **YTDownload-arm64-v8a.apk**. Older 32-bit phones: armeabi-v7a. Emulators/Chromebooks: x86_64.
          files: ytdownload/out/*.apk
