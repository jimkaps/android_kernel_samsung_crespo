name: Build Steps Adder APK

on:
  push:
    paths:
      - "steps-adder/**"
      - ".github/workflows/steps-adder.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steps-adder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StepsAdder-apk
          path: steps-adder/app/build/outputs/apk/debug/app-debug.apk
